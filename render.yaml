services:
  - type: web
    name: indian-stock-extractor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: YOUTUBE_COOKIES_TEXT
        sync: false
      - key: PROXY_URL
        sync: false
